[project]
name = "isomoney"
version = "0.5.0"
description = "An ISO compliant money and currency library"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Khaled Kessoum" }
]

requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
babel = [
    "babel>=2.18.0",
]
pyicu = [
    "pyicu>=2.16.2; sys_platform != 'win32'",
]

[dependency-groups]
dev = [
    "hypothesis>=6.161.8",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "tox>=4.58.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/isomoney"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Test Coverage Configuration
[tool.coverage.run]
source = ["src/isomoney"]
omit = [
    "src/isomoney/iso4217.py",
    "src/isomoney/rounding.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Ruff Configuration

[tool.ruff]
line-length = 88
target-version = "py314"
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
exclude = ["scripts"]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (automatically sorts your imports!)
    "B",   # flake8-bugbear (catches common bugs)
    "UP",  # pyupgrade (upgrades syntax to newer Python versions)
]

ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
files = ["src/isomoney"]
strict = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = [
    "icu",
    "icu.*"
]
ignore_missing_imports = true
